<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 30 150 150" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <!-- Casa Calderon browser tab icon: small-size variant of the dog badge
       (original: assets/logo/logo-badge.svg; site version: src/components/logo.tsx).
       At 16-32px the facet lines merge into a blob, so this keeps only the
       head outline, tongue, eyes and nose, with heavier lines, and drops the circle. -->
  <style>
    .line { stroke: #171717; }
    .solid { fill: #171717; stroke: #171717; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #ededed; }
      .solid { fill: #ededed; stroke: #ededed; }
    }
  </style>
