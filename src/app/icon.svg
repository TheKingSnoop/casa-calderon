    <polyline class="line" stroke-width="7" points="119,150 121,180 113,194 100,198 87,194 79,180 81,150"/>
    <polygon class="solid" stroke-width="4" points="110,76 121,68 135,75 121,82"/>
    <polygon class="solid" stroke-width="4" points="90,76 79,68 65,75 79,82"/>
