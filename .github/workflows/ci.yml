name: CI

# Runs on every pull request, and on main after a merge.
# On main, if every check passes, the `deploy` job publishes the site to AWS.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: by default jobs can only read the code.
# (The deploy job adds `id-token: write` for itself only.)
permissions:
  contents: read

# If you push again to the same PR, cancel the older run (saves Actions minutes).
# On main, never cancel: a newer merge simply queues behind a running deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Format, lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (TypeScript)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build static site (Next.js)
        run: npm run build

      # Hand the exact build that passed the checks to the deploy job.
      - name: Upload site build (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 1
          if-no-files-found: error

  infra:
    name: Infra (type-check, test, cdk synth)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Type-check (TypeScript)
        run: npm run typecheck

      - name: Unit tests (CDK assertions + URL function)
        run: npm test

      # Synth only builds the CloudFormation template locally. It needs no AWS
      # credentials because the stack's account and region are explicit.
      - name: Synthesize CloudFormation (cdk synth)
        run: npm run synth -- --quiet

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Two builds: drafts (every page) and live (exactly what gets deployed)
      - name: Build the test sites
        run: npm run e2e:build

      # Served the way CloudFront serves them, with the production CSP
      - name: Run end-to-end tests
        run: npm run e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy site to AWS (S3 + CloudFront)
    # Only after a merge to main, and only if every check above passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, infra, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # lets this job request a GitHub OIDC token for AWS
    env:
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Download the tested site build
        uses: actions/download-artifact@v8
        with:
          name: site
          path: out

      # Exchanges the OIDC token for short-lived credentials (1h) for the
      # casa-calderon-github-deploy role. No AWS keys are stored in GitHub.
      # Third-party action receiving credentials: pinned to a commit SHA (v6.3.0).
      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
          allowed-account-ids: "804450520614"

      # 1. Hashed assets first (new files only add, nothing breaks mid-deploy).
      #    Their names change whenever their content does, so cache for a year.
      - name: Upload static assets (cached 1 year)
        run: >
          aws s3 sync out/_next/static "s3://$SITE_BUCKET/_next/static"
          --cache-control "public,max-age=31536000,immutable"

      # 2. HTML and everything else: browsers always re-check for a new version.
      #    --delete removes pages that no longer exist.
      - name: Upload pages (always revalidated)
        run: >
          aws s3 sync out "s3://$SITE_BUCKET" --delete
          --exclude "_next/static/*"
          --cache-control "public,max-age=0,must-revalidate"

      # 3. Now that the new HTML is live, remove asset files nothing references.
      - name: Remove old static assets
        run: aws s3 sync out/_next/static "s3://$SITE_BUCKET/_next/static" --delete

      # Tell CloudFront to drop its cached copies (1 path; 1,000 free per month).
      - name: Invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/*"
          --query "Invalidation.[Id,Status]" --output text

      - name: Summary
        run: echo "Deployed to https://d2ea5d75wlmb93.cloudfront.net" >> "$GITHUB_STEP_SUMMARY"
