name: CI

# Runs on every pull request, and on main after a merge.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# If you push again to the same PR, cancel the older run (saves Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (TypeScript)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build static site (Next.js)
        run: npm run build

  infra:
    name: Infra (type-check, test, cdk synth)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Type-check (TypeScript)
        run: npm run typecheck

      - name: Unit tests (CDK assertions + URL function)
        run: npm test

      # Synth only builds the CloudFormation template locally. It needs no AWS
      # credentials because the stack's account and region are explicit.
      - name: Synthesize CloudFormation (cdk synth)
        run: npm run synth -- --quiet
